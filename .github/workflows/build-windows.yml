name: Build Windows executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Download and verify static FFmpeg
        run: python scripts/prepare_ffmpeg.py
      - name: Build standalone executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --noupx --name ImageMotionTool --add-binary "ffmpeg.exe;."
          image_motion_tool.py
      - name: Validate packaged application and FFmpeg
        run: python scripts/smoke_windows.py
      - name: Upload Windows executable and FFmpeg notices
        uses: actions/upload-artifact@v4
        with:
          name: ImageMotionTool-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30


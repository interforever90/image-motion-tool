name: Build Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Download and verify static FFmpeg
        run: python scripts/prepare_ffmpeg.py
      - name: Build standalone executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --noupx --name ImageMotionTool --add-binary "ffmpeg.exe;."
          image_motion_tool.py
      - name: Validate packaged application and FFmpeg
        run: python scripts/smoke_windows.py
      - name: Upload Windows executable and FFmpeg notices
        uses: actions/upload-artifact@v4
        with:
          name: ImageMotionTool-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-image-motion-tool
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ImageMotionTool-Windows-x64
          path: dist
      - name: Publish release then update version.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_release.py

  verify-update:
    if: github.ref == 'refs/tags/v5.15'
    needs: release
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify V5.14 download, replacement and V5.15 restart
        shell: pwsh
        run: python scripts/verify_update_windows.py
